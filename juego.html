<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Juego</title>
</head>

<body>
    <div class="bg-transicion bg-transicion-show"></div>

    <div class="ganador">
        <div class="personajeGanador">
            <h1>Ganador: <span id="nomGanador"></span></h1>
            <img src="" id="imgGanador">
            <button onclick="reiniciarJuego()" class="restart">VOLVER A JUGAR</button>
        </div>
    </div>
    <div class="bg-juego">
        <div class="left" onclick="disparo1()">
            <h2 id="jugador1"></h2>
            <div class="vidas1"></div>
        </div>
        <div class="right" onclick="disparo2()">
            <h2 id="jugador2"></h2>
            <div class="vidas2"></div>
        </div>
    </div>

    <div class="conteo">
        <div class="no3"><img src="imagenes/no3.png"></div>
        <div class="no2"><img src="imagenes/no2.png"></div>
        <div class="no1"><img src="imagenes/no1.png"></div>

        <div class="msj" onclick="conteo()">PREPARADO?</div>
    </div>


</body>
<script type="text/javascript" src="funciones.js"></script>
<script type="text/javascript">
    window.addEventListener('load', quitarBG);
    window.addEventListener('load', cargarEscenario); 
</script>

</html>
