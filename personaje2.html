<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">

    <title>Document</title>
</head>

<body>
    <div class="bg-transicion bg-transicion-show"></div>

    <div class="bg-personaje">
        <div class="titulo">
            <h1>Selecciona tu personaje</h1>
        </div>


        <div class="personajes">
            <button class="anterior" onclick="anterior()">
                <img src="imagenes/left.png">
            </button>

            <div class="personaje">
                <img src="imagenes/personaje1.png" id="personaje" style="transform: rotateY(180deg)" ;>
            </div>

            <button class="siguiente" onclick="siguiente()">
                <img src="imagenes/right.png">
            </button>
        </div>
        <div class="barra">
            <input type="text" id="jugador 2" placeholder="Jugador 2" class="txt-nombre">
            <button class="btn-aceptar" onclick="comenzarJuego()">ACEPTAR</button>
        </div>


    </div>
</body>
<script type="text/javascript" src="funciones.js"></script>
<script type="text/javascript">
    window.addEventListener('load', quitarBG);
    window.addEventListener('load', function () {
        document.getElementById('jugador1').textContent = localStorage.getItem('jugador 1');
        document.getElementById('jugador2').textContent = localStorage.getItem('jugador 2');
    });
</script>

</html>
